[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-photo-video"
version = "0.1.0.dev0"
description = "Mobile-first computational photo/video reconstruction framework"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mobile = ["numpy>=1.26", "tifffile>=2024.2", "Pillow>=10"]
optical = ["opencv-python-headless>=4.8"]
face-server = ["opencv-python-headless>=4.8", "onnxruntime>=1.18"]
neural = ["onnxruntime>=1.18"]
server = ["numpy>=1.26", "tifffile>=2024.2", "opencv-python-headless>=4.8", "torch>=2.2"]
test = ["pytest>=8"]

[project.scripts]
aether = "aether.mobile.cli:main"
aether-render = "mobile_s24.s24_render:main"
aether-cascade = "mobile_s24.s24_cascade:main"
aether-depth = "aether.vision.depth_cli:main"
aether-ingest = "aether.ingest.cli:main"
aether-codeformer = "aether.vision.codeformer_onnx:main"
aether-device-test = "aether.mobile.device_acceptance:main"
aether-media = "aether.media_cli:main"
aether-neural-check = "aether.vision.model_acceptance:main"
aether-gpu-check = "aether.remote.gpu_acceptance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
