name: Aether core tests
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[mobile,optical]"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m aether.mobile.cli plan --width 6000 --height 4000 --target-mp 400
        env:
          PYTHONPATH: src
